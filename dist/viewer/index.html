<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Witness record</title>
<style>
/* Layout: verdict band, then tabs; Overview = touched list + surface map; a right drawer holds detail. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --sunken: #eef0f4; --line: #e1e4ea; --line-strong: #c9ced8;
  --fg: #141821; --muted: #5d6676; --faint: #8a92a1; --accent: #3446c8; --accent-soft: #e8ebfb;
  --proven: #1a7f4b; --proven-soft: #e3f4ea; --failing: #c4362b; --failing-soft: #fce9e7;
  --unsure: #a15c00; --unsure-soft: #fdf1dc; --over: #7442b8; --over-soft: #f1e9fb;
  --exercised: #7b8597; --exercised-soft: #edf0f4; --untested: #c4c9d3;
  --code: #f3f4f7; --shadow: 0 1px 2px rgba(20, 24, 33, .06), 0 4px 16px rgba(20, 24, 33, .06);
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0e1116; --surface: #161a21; --sunken: #1c212a; --line: #262c37; --line-strong: #353d4b;
  --fg: #e7eaf0; --muted: #9aa3b3; --faint: #6f7888; --accent: #8e9cff; --accent-soft: #1f2547;
  --proven: #4cc38a; --proven-soft: #12301f; --failing: #ff7b70; --failing-soft: #3a1a17;
  --unsure: #eab14d; --unsure-soft: #352710; --over: #c39cff; --over-soft: #2a1d3e;
  --exercised: #8d97a8; --exercised-soft: #222833; --untested: #3a414e; --code: #11151b;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark; } }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
code, .mono { font-family: var(--mono); font-size: 12px; }
a { color: var(--accent); }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 28px; }
.bar { border-bottom: 1px solid var(--line); background: var(--surface); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; min-height: 46px; font-size: 12.5px; color: var(--muted); }
.brand { font-weight: 700; color: var(--fg); letter-spacing: -.01em; font-size: 14px; }
.bar .sep { color: var(--line-strong); }
.band { padding: 26px 0 18px; }
.verdict-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.verdict { display: inline-flex; align-items: center; gap: 10px; font-size: 26px; font-weight: 750; letter-spacing: -.02em; }
.vdot { width: 12px; height: 12px; border-radius: 50%; }
.v-proven .vdot { background: var(--proven); } .v-proven_pending .vdot { background: var(--proven); box-shadow: 0 0 0 4px var(--unsure-soft); }
.v-needs_a_look .vdot { background: var(--failing); } .v-unproven .vdot, .v-mistrial .vdot { background: var(--unsure); }
.headline { font-size: 15.5px; color: var(--fg); max-width: 920px; margin: 8px 0 0; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.stat-k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.stat-v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.stat-v small { font-size: 13px; color: var(--muted); font-weight: 500; }
.meter { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--sunken); margin-top: 8px; }
.meter i { display: block; height: 100%; }
.approve { margin-top: 14px; background: var(--unsure-soft); border: 1px solid color-mix(in srgb, var(--unsure) 35%, transparent); border-radius: 10px; padding: 12px 16px; }
.approve h3 { margin: 0 0 4px; font-size: 13.5px; color: var(--unsure); }
.approve ul { margin: 0; padding-left: 18px; font-size: 13.5px; }
.warns { margin-top: 10px; font-size: 13px; color: var(--muted); }
.warns p { margin: 4px 0; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 6px; overflow-x: auto; }
.tab { background: none; border: 0; padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; white-space: nowrap; font-weight: 500; }
.tab.on { color: var(--fg); border-bottom-color: var(--accent); }
.tab .n { font-size: 11px; background: var(--sunken); border-radius: 999px; padding: 1px 7px; margin-left: 6px; color: var(--muted); }
.tab:focus-visible, .op:focus-visible, .row:focus-visible, .shot:focus-visible, .chip:focus-visible, .touched-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view { padding: 22px 0 60px; }
.ov { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 24px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0; padding: 14px 16px 8px; font-weight: 600; }
.touched-item { display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; padding: 9px 16px; border: 0; border-top: 1px solid var(--line); cursor: pointer; background: none; width: 100%; text-align: left; }
.touched-item:hover { background: var(--sunken); }
.touched-item .sw { margin-top: 5px; }
.t-title { font-size: 13px; font-weight: 600; word-break: break-word; }
.t-why { font-size: 12.5px; color: var(--muted); }
.empty { color: var(--muted); font-size: 13px; padding: 12px 16px 16px; }
.map-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.map-head h2 { font-size: 16px; margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 12.5px; cursor: pointer; color: var(--muted); }
.chip.on { background: var(--fg); color: var(--surface); border-color: var(--fg); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); margin: 0 0 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; flex: none; }
.s-proven { background: var(--proven); } .s-failing { background: var(--failing); } .s-unsure { background: var(--unsure); }
.s-exercised { background: var(--exercised); } .s-untested { background: transparent; box-shadow: inset 0 0 0 1.5px var(--untested); }
.ring { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--accent); display: inline-block; }
.features { columns: 2 340px; column-gap: 16px; }
.feat { break-inside: avoid; margin-bottom: 16px; overflow: hidden; }
.feat-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 12px 14px 8px; }
.feat-h b { font-size: 14px; }
.feat-h span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.feat-bar { display: flex; gap: 2px; padding: 0 14px 10px; }
.feat-bar i { flex: 1; height: 5px; border-radius: 2px; }
.op { display: grid; grid-template-columns: 10px 52px minmax(0, 1fr) auto; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 7px 14px; cursor: pointer; }
.op:hover { background: var(--sunken); }
.op.dim { opacity: .4; }
.op.touched { background: color-mix(in srgb, var(--accent-soft) 70%, transparent); }
.m { font: 600 10.5px var(--mono); letter-spacing: .02em; color: var(--muted); }
.p { font: 12.5px var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.op-tail { display: flex; gap: 6px; align-items: center; font-size: 11.5px; color: var(--muted); }
.unmatched { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.claims { display: grid; gap: 18px; }
.group h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
.row { display: grid; grid-template-columns: 96px 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 11px 14px; cursor: pointer; margin-bottom: 6px; }
.row:hover { border-color: var(--line-strong); }
.pill { display: inline-flex; align-items: center; justify-content: center; font-size: 11.5px; font-weight: 600; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.p-proven { background: var(--proven-soft); color: var(--proven); } .p-failed, .p-flaky { background: var(--failing-soft); color: var(--failing); }
.p-cant_tell, .p-not_tested { background: var(--unsure-soft); color: var(--unsure); } .p-overturned { background: var(--over-soft); color: var(--over); }
.cid { font: 600 12px var(--mono); color: var(--muted); }
.ctext { font-size: 13.5px; min-width: 0; }
.ctext small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.b { font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 0 6px; color: var(--muted); white-space: nowrap; }
.b.good { color: var(--proven); border-color: color-mix(in srgb, var(--proven) 40%, transparent); }
.b.bad { color: var(--failing); border-color: color-mix(in srgb, var(--failing) 40%, transparent); }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
.shot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; cursor: pointer; text-align: left; padding: 0; }
.shot:hover { box-shadow: var(--shadow); }
.thumb { aspect-ratio: 16 / 10; background: var(--sunken) center top / cover no-repeat; border-bottom: 1px solid var(--line); max-width: 100%; }
.shot-b { padding: 10px 12px; display: grid; gap: 4px; }
.shot-b b { font-size: 13px; }
.shot-b span { font-size: 12px; color: var(--muted); }
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 16, .28); z-index: 1; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(880px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--shadow); z-index: 1; overflow-y: auto; padding: 22px 26px 40px; }
.d-close { float: right; background: var(--sunken); border: 0; border-radius: 8px; padding: 5px 11px; cursor: pointer; }
.d-kicker { font-size: 12px; color: var(--muted); }
.d-title { font-size: 19px; font-weight: 700; margin: 4px 0 6px; line-height: 1.3; }
.d-sec { margin-top: 20px; }
.d-sec h4 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.reasons { background: var(--sunken); border-radius: 10px; padding: 10px 14px; font-size: 13.5px; }
.reasons p { margin: 4px 0; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.col-h { font-size: 11.5px; color: var(--muted); margin-bottom: 6px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.ex { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
.ex summary { list-style: none; display: flex; gap: 8px; align-items: center; padding: 8px 10px; cursor: pointer; font: 12px var(--mono); background: var(--sunken); }
.ex summary::-webkit-details-marker { display: none; }
.ex summary .p { flex: 1; min-width: 0; }
.st { font-weight: 700; } .st.s2 { color: var(--proven); } .st.s4, .st.s5 { color: var(--failing); }
.ex pre { margin: 0; padding: 10px; max-height: 280px; overflow: auto; white-space: pre-wrap; word-break: break-word; font-size: 11.5px; background: var(--code); }
.lbl { font-size: 10.5px; color: var(--muted); padding: 6px 10px 0; background: var(--code); text-transform: uppercase; letter-spacing: .05em; }
table.diff { border-collapse: collapse; width: 100%; font-size: 12.5px; }
table.diff th, table.diff td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.diff th { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
table.diff td.o { color: var(--failing); } table.diff td.t { color: var(--proven); }
.tw { overflow-x: auto; }
.src { background: var(--code); border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; font: 12px/1.55 var(--mono); margin: 0; }
.src .hl { background: var(--accent-soft); display: inline-block; min-width: 100%; }
.judge { border-radius: 10px; padding: 12px 14px; background: var(--unsure-soft); }
.judge.over { background: var(--over-soft); }
.judge p { margin: 6px 0; }
.cite { font: 12px var(--mono); margin: 4px 0; }
.ok { color: var(--proven); } .no { color: var(--failing); }
.cmp { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.cmp figure { margin: 0; min-width: 0; }
.cmp img { width: 100%; border: 1px solid var(--line); border-radius: 8px; display: block; }
.cmp figcaption { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.files { font-size: 12.5px; }
.other-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.other-table td, .other-table th { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
.mistrial { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.mistrial pre { background: var(--code); padding: 10px; border-radius: 8px; overflow: auto; max-height: 360px; }
@media (max-width: 980px) { .ov { grid-template-columns: minmax(0, 1fr); } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .cmp { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .wrap { padding: 0 16px; } .cols { grid-template-columns: minmax(0, 1fr); } .row { grid-template-columns: 1fr; gap: 6px; } .badges { justify-content: flex-start; } .drawer { padding: 18px 16px 32px; } }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .16s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
</style>
</head>
<body>
<header class="bar"><div class="wrap" id="bar"></div></header>
<div class="wrap">
  <section class="band" id="band"></section>
  <nav class="tabs" id="tabs" aria-label="Views"></nav>
  <main class="view" id="view"></main>
</div>
<div id="drawer-root"></div>
<script>
const B = /*__WITNESS_DATA__*/null;
const WORD = { proven: "Proven", proven_pending: "Proven, pending approval", needs_a_look: "Needs a look", unproven: "Nothing proven", mistrial: "Mistrial" };
const SWORD = { proven: "Proven", failed: "Failed", cant_tell: "Can't tell", overturned: "Overturned", not_tested: "Not tested", flaky: "Flaky" };
const OPWORD = { proven: "proven by a claim", failing: "a claim fails", unsure: "not settled", exercised: "called by tests, no claim", untested: "never called" };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const short = (s) => (s || "").slice(0, 7);
const ms = (n) => (n < 1000 ? n + " ms" : (n / 1000).toFixed(1) + " s");
const pretty = (s) => { if (!s) return ""; try { return JSON.stringify(JSON.parse(s), null, 2); } catch { return s; } };
const BASE = () => (B.base ? `${B.base.ref}@${short(B.base.sha)}` : "the base");
const ORIGIN = () => (B.originSide === "origin" ? "legacy app" : B.base ? B.base.ref : "base");
const isBad = (s) => s === "failed" || s === "flaky";
const isUnsure = (s) => s === "cant_tell" || s === "not_tested";
const ops = () => (B.surface ? B.surface.ops : []);
const touchedOps = () => ops().filter((o) => o.changed.length);
const changedScreens = () => (B.screens || []).filter((s) => s.status === "text" || s.status === "visual");
const nice = (n) => n.replace(/^\d+-/, "").replace(/-/g, " ");
let tab = (location.hash || "#overview").slice(1);
let filter = "all";

function bar() {
  document.getElementById("bar").innerHTML = `<span class="brand">witness</span><span class="sep">/</span><span>${esc(B.head.branch || "change")} @ <span class="mono">${short(B.head.sha)}</span>${B.head.dirty ? " + uncommitted" : ""}</span>${B.base ? `<span>compared with <span class="mono">${esc(BASE())}</span></span>` : ""}${B.originSide === "origin" ? `<span>origin: legacy app <span class="mono">${esc(B.origin.repo)}</span></span>` : ""}<span>level ${esc(B.level)}</span><span>${ms(B.ms)}</span><span>${esc(new Date(B.startedAt).toLocaleString())}</span>`;
}

function headline() {
  if (B.verdict === "mistrial") return `The app couldn't be put on trial: ${esc(B.mistrial.message)}`;
  if (B.verdict === "unproven") return "No claims cover this change, so nothing was proven.";
  const t = touchedOps(), bad = B.claims.filter((c) => isBad(c.status)), uns = B.claims.filter((c) => isUnsure(c.status));
  const sc = changedScreens();
  const parts = [];
  if (t.length || sc.length) parts.push(`This change touches ${t.length} endpoint${t.length === 1 ? "" : "s"}${sc.length ? ` and ${sc.length} screen${sc.length === 1 ? "" : "s"}` : ""}.`);
  if (bad.length) parts.push(`${bad.length} claim${bad.length === 1 ? "" : "s"} fail${bad.length === 1 ? "s" : ""} (${bad.map((c) => esc(c.id)).join(", ")}): ${esc(bad[0].text.replace(/\.$/, ""))}${bad.length > 1 ? ", and more" : ""}.`);
  else if (uns.length) parts.push(`Nothing fails, but ${uns.length} claim${uns.length === 1 ? " isn't" : "s aren't"} settled.`);
  else parts.push("Every claim holds.");
  if (B.surface) { const never = ops().filter((o) => o.state === "untested").length; parts.push(`${never} of ${ops().length} endpoints were never called by any test.`); }
  return parts.join(" ");
}

function band() {
  const k = B.counts || {};
  const total = B.claims.length || 1;
  const seg = (n, v) => (n ? `<i style="width:${(n / total) * 100}%;background:var(${v})"></i>` : "");
  const called = ops().filter((o) => o.calls).length;
  const bites = B.claims.filter((c) => c.bite === "bites").length, vac = B.claims.filter((c) => c.bite === "vacuous").length;
  const d = B.declarations, dl = [];
  if (d) {
    if (d.added.length) dl.push(`New claims: ${d.added.join(", ")}`);
    if (d.changed.length) dl.push(`Edited claims: ${d.changed.join(", ")}`);
    if (d.retired.length) dl.push(`Retired claims: ${d.retired.join(", ")}`);
    if (d.removed.length) dl.push(`<b>Deleted claims (no reason given): ${d.removed.join(", ")}</b>`);
    if (d.harness?.length) dl.push(`<b>Boot or test setup changed: ${esc(d.harness.join(", "))}</b>`);
    d.rules.added.forEach((l) => dl.push(`Comparison rule added: <code>${esc(l)}</code>`));
    d.rules.removed.forEach((l) => dl.push(`Comparison rule removed: <code>${esc(l)}</code>`));
    B.claims.filter((c) => c.tags.includes("changed") && (d.added.includes(c.id) || d.changed.includes(c.id))).forEach((c) => dl.push(`Declared difference in ${esc(c.id)}: ${esc(c.expectDiff.join(", "))}`));
  }
  const warns = (B.warnings || []).filter((w) => !/^Claims deleted|This PR changes how/.test(w));
  document.getElementById("band").innerHTML = `
    <div class="verdict-row"><span class="verdict v-${B.verdict}"><span class="vdot"></span>${WORD[B.verdict]}</span></div>
    <p class="headline">${headline()}</p>
    ${B.verdict === "mistrial" ? "" : `<div class="stats">
      <div class="stat"><div class="stat-k">Claims proven</div><div class="stat-v">${(k.proven || 0) + (k.overturned || 0)} <small>of ${B.claims.length}</small></div><div class="meter">${seg(k.proven, "--proven")}${seg(k.overturned, "--over")}${seg((k.cant_tell || 0) + (k.not_tested || 0), "--unsure")}${seg((k.failed || 0) + (k.flaky || 0), "--failing")}</div></div>
      <div class="stat"><div class="stat-k">Bite check</div><div class="stat-v">${B.base && bites + vac ? `${bites} <small>of ${bites + vac} new tests fail without the change</small>` : `<small>${B.base ? "no new tests" : "no base commit"}</small>`}</div></div>
      <div class="stat"><div class="stat-k">Touched</div><div class="stat-v">${touchedOps().length} <small>endpoints</small>${(B.screens || []).length ? ` · ${changedScreens().length} <small>screens</small>` : ""}</div></div>
      <div class="stat"><div class="stat-k">API called by tests</div><div class="stat-v">${B.surface ? `${called} <small>of ${ops().length} endpoints</small>` : `<small>no API spec</small>`}</div>${B.surface ? `<div class="meter"><i style="width:${(called / Math.max(1, ops().length)) * 100}%;background:var(--exercised)"></i></div>` : ""}</div>
    </div>`}
    ${dl.length ? `<div class="approve"><h3>For the reviewer to approve</h3><ul>${dl.map((x) => `<li>${x}</li>`).join("")}</ul></div>` : ""}
    ${warns.length ? `<div class="warns">${warns.map((w) => `<p>Note: ${esc(w)}</p>`).join("")}</div>` : ""}`;
}

function tabs() {
  const t = [["overview", "Overview", null], ["claims", "Claims", B.claims.length], ["screens", "Screens", (B.screens || []).length], ["run", "Run details", null]];
  document.getElementById("tabs").innerHTML = t.map(([id, label, n]) => `<button class="tab${tab === id ? " on" : ""}" data-tab="${id}">${label}${n != null ? `<span class="n">${n}</span>` : ""}</button>`).join("");
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => { closeDrawer(); tab = b.dataset.tab; history.replaceState(null, "", "#" + tab); render(); }));
}

function claimStateForTest(test) {
  const c = B.claims.find((x) => x.testId === test);
  if (!c) return "exercised";
  return isBad(c.status) ? "failing" : isUnsure(c.status) ? "unsure" : "proven";
}

/** Collapse a list of reasons into short categories. */
function why(changed) {
  const out = [];
  if (changed.some((x) => x.startsWith("new in the API spec"))) out.push("new in the API spec");
  else if (changed.some((x) => x.startsWith("API spec changed"))) out.push("API spec changed");
  const nc = changed.filter((x) => /\(new behavior\)/.test(x)).length, dc = changed.filter((x) => /\(declared change\)/.test(x)).length;
  if (nc) out.push(`${nc} new claim${nc === 1 ? "" : "s"}`);
  if (dc) out.push(`${dc} declared change${dc === 1 ? "" : "s"}`);
  const rd = changed.filter((x) => x.startsWith("responses differ")).length;
  if (rd) out.push(`responses differ from ${ORIGIN()}${rd > 1 ? ` in ${rd} tests` : ""}`);
  return out.join(" · ");
}

function touchedList() {
  const items = [];
  for (const o of touchedOps()) items.push({ kind: "op", key: o.key, title: `${o.method} ${o.path}`, why: why(o.changed), state: o.state });
  for (const s of changedScreens()) items.push({ kind: "screen", key: `${s.test}|${s.name}`, title: `Screen: ${nice(s.name)}`, why: s.status === "text" ? `text differs from ${ORIGIN()}` : `pixels differ (${((s.ratio || 0) * 100).toFixed(1)}%)`, state: claimStateForTest(s.test) });
  for (const c of B.claims.filter((c) => c.synthetic === "uncovered")) items.push({ kind: "claim", key: c.id, title: c.text, why: "asked for, but no claim covers it", state: "unsure" });
  const order = { failing: 0, unsure: 1, exercised: 2, proven: 3, untested: 4 };
  items.sort((a, b) => order[a.state] - order[b.state]);
  if (!items.length) return `<div class="empty">Nothing in the API spec or the screens changed, and no claim marks new behavior.</div>`;
  return items.map((i) => `<button class="touched-item" data-kind="${i.kind}" data-key="${esc(i.key)}"><span class="sw s-${i.state}"></span><span><span class="t-title">${esc(i.title)}</span><br><span class="t-why">${esc(i.why)} · ${esc(OPWORD[i.state] || i.state)}</span></span></button>`).join("");
}

function map() {
  if (!B.surface) return `<div class="panel"><div class="empty">Add <code>schema = "path/to/openapi.yml"</code> to the API surface in <code>witness.toml</code> to see the surface map.</div></div>`;
  const keep = (o) => filter === "all" || (filter === "touched" && o.changed.length) || (filter === "problems" && (o.state === "failing" || o.state === "unsure")) || (filter === "untested" && o.state === "untested");
  const feats = {};
  for (const o of ops()) (feats[o.feature] ||= []).push(o);
  const rank = (os) => -(os.filter((o) => o.changed.length).length * 100 + os.filter((o) => o.state === "failing").length * 50 + os.filter((o) => o.calls).length);
  const html = Object.entries(feats).sort((a, b) => rank(a[1]) - rank(b[1])).map(([f, os]) => {
    if (!os.some(keep) && filter !== "all") return "";
    const called = os.filter((o) => o.calls).length, ch = os.filter((o) => o.changed.length).length;
    return `<div class="feat panel"><div class="feat-h"><b>${esc(f)}</b><span>${called}/${os.length} called${ch ? ` · ${ch} touched` : ""}</span></div>
      <div class="feat-bar">${os.map((o) => `<i class="s-${o.state}" title="${esc(o.method + " " + o.path)}"></i>`).join("")}</div>
      ${os.map((o) => `<button class="op${keep(o) ? "" : " dim"}${o.changed.length ? " touched" : ""}" data-op="${esc(o.key)}" title="${esc(OPWORD[o.state])}"><span class="sw s-${o.state}"></span><span class="m">${o.method}</span><span class="p">${esc(o.path)}</span><span class="op-tail">${o.changed.length ? `<span class="ring" title="touched by this change"></span>` : ""}${o.calls ? `${o.tests.length} test${o.tests.length === 1 ? "" : "s"}` : ""}</span></button>`).join("")}</div>`;
  }).join("");
  const um = B.surface.unmatched;
  return `<div class="map-head"><h2>API surface</h2><div class="chips">${[["all", "All"], ["touched", "Touched"], ["problems", "Problems"], ["untested", "Never called"]].map(([k, l]) => `<button class="chip${filter === k ? " on" : ""}" data-f="${k}">${l}</button>`).join("")}</div></div>
    <div class="legend"><span><i class="sw s-proven"></i>proven by a claim</span><span><i class="sw s-failing"></i>a claim fails</span><span><i class="sw s-unsure"></i>not settled</span><span><i class="sw s-exercised"></i>called, no claim</span><span><i class="sw s-untested"></i>never called</span><span><i class="ring"></i>touched by this change</span></div>
    <div class="features">${html}</div>
    ${um.length ? `<p class="unmatched">Called but not in the spec: ${um.map((u) => `<code>${esc(u.method + " " + u.path)}</code>`).join(", ")}</p>` : ""}
    <p class="unmatched">From <code>${esc(B.surface.source)}</code>. Touched means the API spec changed, a claim marks new or changed behavior, or responses differ from ${esc(ORIGIN())}.</p>`;
}

function overview() {
  return `<div class="ov"><aside class="panel"><h2>What this change touched</h2>${touchedList()}</aside><section>${map()}</section></div>`;
}

const ORDER = { failed: 0, flaky: 1, cant_tell: 2, not_tested: 3, overturned: 4, proven: 5 };
function badges(c) {
  const b = [];
  if (c.bite === "bites") b.push(`<span class="b good">fails without the change</span>`);
  if (c.bite === "vacuous") b.push(`<span class="b bad">passes without the change</span>`);
  if (c.parity) b.push(`<span class="b ${c.parity.status === "unexplained" && c.status !== "overturned" ? "bad" : "good"}">${c.parity.status === "equal" ? `same as ${esc(ORIGIN())}` : c.parity.status === "intended" ? "declared difference" : c.status === "overturned" ? "difference allowed" : `differs from ${esc(ORIGIN())}`}</span>`);
  if (c.judge) b.push(`<span class="b">judged</span>`);
  if ((B.screens || []).some((s) => s.test === c.testId)) b.push(`<span class="b">screens</span>`);
  return b.join("");
}
function claimRow(c, withReason) {
  return `<button class="row" data-claim="${esc(c.id)}"><span class="pill p-${c.status}">${SWORD[c.status]}</span><span class="cid">${esc(c.id)}</span><span class="ctext">${esc(c.text)}${withReason && c.status !== "proven" && c.reasons.length ? `<small>${esc(c.reasons[c.reasons.length - 1].slice(0, 220))}</small>` : ""}</span><span class="badges">${badges(c)}</span></button>`;
}
function claimsView() {
  const groups = {};
  for (const c of [...B.claims].sort((a, b) => ORDER[a.status] - ORDER[b.status])) (groups[c.feature] ||= []).push(c);
  let html = Object.entries(groups).map(([g, cs]) => `<div class="group"><h3>${esc(g)}</h3>${cs.map((c) => claimRow(c, true)).join("")}</div>`).join("");
  if ((B.otherTests || []).length) html += `<div class="group"><h3>Other boundary tests (no claim)</h3><div class="panel tw"><table class="other-table"><thead><tr><th></th><th>Test</th><th>Result</th><th>Time</th></tr></thead><tbody>${B.otherTests.map((t) => `<tr><td><span class="sw s-${t.status === "passed" ? "exercised" : "failing"}"></span></td><td><code>${esc(t.id)}</code></td><td>${esc(t.status)}</td><td>${ms(t.ms)}</td></tr>`).join("")}</tbody></table></div></div>`;
  return `<div class="claims">${html}</div>`;
}

function screenStatus(s) {
  return s.status === "same" ? `same as ${ORIGIN()}` : s.status === "text" ? `text differs from ${ORIGIN()}` : s.status === "visual" ? `${((s.ratio || 0) * 100).toFixed(1)}% of pixels differ` : s.origin ? "missing on this change" : `nothing to compare on ${ORIGIN()}`;
}
function screensView() {
  const sc = B.screens || [];
  if (!sc.length) return `<div class="panel"><div class="empty">No UI checkpoints were captured. UI tests save screenshots with the witness helper's <code>checkpoint(page, name)</code>.</div></div>`;
  const order = { text: 0, visual: 1, missing: 2, same: 3 };
  return `<div class="shots">${[...sc].sort((a, b) => order[a.status] - order[b.status]).map((s) => `<button class="shot" data-shot="${sc.indexOf(s)}"><div class="thumb" style="background-image:url('${esc(s.head || s.origin || "")}')"></div><div class="shot-b"><b>${esc(nice(s.name))}</b><span>${esc(s.test)}</span><span><i class="sw s-${s.status === "text" ? "failing" : s.status === "visual" ? "unsure" : s.status === "missing" ? "untested" : "proven"}"></i> ${esc(screenStatus(s))}</span></div></button>`).join("")}</div>`;
}

function runView() {
  const L = Object.entries(B.layers || {}).map(([k, v]) => `<tr><td>${esc({ target: "this change", base: BASE(), origin: B.originSide === "origin" ? "legacy app" : "origin", parity: "comparison" }[k] || k)}</td><td>${v.reused ? "reused from an earlier run" : "ran" + (v.ms ? " in " + ms(v.ms) : "")}</td><td>${esc(v.note || "")}</td></tr>`).join("");
  const files = Object.entries(B.uiFiles || {});
  return `<div class="claims">
    <div class="group"><h3>Layers</h3><div class="panel tw"><table class="other-table"><tbody>${L}</tbody></table></div></div>
    <div class="group"><h3>Sources the judge could see</h3><div class="panel"><div class="empty">${(B.sources || []).map((s) => `${esc(s.name)}${s.canOverturn ? " (may justify an overturn)" : ""}`).join(" · ") || "none"} · ${B.judgeCalls} judge call(s) this run</div></div></div>
    ${files.length ? `<div class="group"><h3>Traces and videos</h3><div class="panel"><div class="empty files">${files.map(([t, fs]) => `${esc(t)}: ${fs.map((f) => `<a href="${esc(f)}">${esc(f.split("/").pop())}</a>`).join(", ")}`).join("<br>")}<br>Open a trace with <code>npx playwright show-trace &lt;file&gt;</code>.</div></div></div>` : ""}
    <div class="group"><h3>Files</h3><div class="panel"><div class="empty">${(B.logs || []).map((l) => `<a href="logs/${esc(l)}">${esc(l)}</a>`).join(" · ")} · <a href="bundle.json">bundle.json</a> · <a href="pr.md">pr.md</a> · <a href="agent.md">agent.md</a></div></div></div>
  </div>`;
}

function exHtml(e) {
  return `<details class="ex"><summary><b>${esc(e.method)}</b><span class="p">${esc(e.path)}${e.upstreamPath ? ` → ${esc(e.upstreamPath)}` : ""}</span><span class="st s${String(e.status)[0]}">${e.status}</span><span>${ms(e.ms)}</span></summary>${e.reqBody ? `<div class="lbl">request</div><pre>${esc(pretty(e.reqBody))}</pre>` : ""}<div class="lbl">response</div><pre>${esc(pretty(e.resBody)) || "(empty)"}</pre></details>`;
}
const STATIC = /\.(js|mjs|css|png|jpe?g|gif|svg|ico|woff2?|ttf|map|webp)(\?|$)/i;
const isStatic = (e) => STATIC.test(e.path) || /text\/html/.test(e.resHeaders?.["content-type"] || "");
const exFor = (test, side) => B.exchanges.filter((e) => e.test === test && e.side === side && e.run === "primary");
function exList(list) {
  const api = list.filter((e) => !isStatic(e)), st = list.filter(isStatic);
  return (api.map(exHtml).join("") || '<div class="empty">no API calls</div>') + (st.length ? `<details class="ex"><summary><span class="p">${st.length} page and static file request${st.length === 1 ? "" : "s"}</span></summary>${st.map((e) => `<div class="mono" style="padding:4px 10px">${esc(e.method)} ${esc(e.path)} · ${e.status}</div>`).join("")}</details>` : "");
}
function diffTable(p) {
  if (!p || !p.diffs.length) return "";
  return `<div class="tw"><table class="diff"><thead><tr><th>Field</th><th>${esc(ORIGIN())}</th><th>this change</th></tr></thead><tbody>${p.diffs.slice(0, 30).map((d) => `<tr><td><code>${esc(d.field)}</code></td><td class="o"><code>${esc(d.origin)}</code></td><td class="t"><code>${esc(d.target)}</code></td></tr>`).join("")}</tbody></table></div>`;
}
function compareHtml(s) {
  return `<div style="margin-bottom:16px"><div class="col-h"><b>${esc(nice(s.name))}</b> · ${esc(screenStatus(s))}${s.size ? ` · ${esc(s.size)}` : ""}</div>
    <div class="cmp">${s.origin ? `<figure><figcaption>${esc(ORIGIN())}</figcaption><a href="${esc(s.origin)}"><img src="${esc(s.origin)}" alt="${esc(ORIGIN())} screenshot"></a></figure>` : ""}${s.head ? `<figure><figcaption>this change</figcaption><a href="${esc(s.head)}"><img src="${esc(s.head)}" alt="screenshot of this change"></a></figure>` : ""}${s.diff ? `<figure><figcaption>difference (red)</figcaption><a href="${esc(s.diff)}"><img src="${esc(s.diff)}" alt="pixel difference"></a></figure>` : ""}</div>
    ${s.textChanges.length ? `<div class="tw" style="margin-top:8px"><table class="diff"><thead><tr><th>${esc(ORIGIN())} text</th><th>this change</th></tr></thead><tbody>${s.textChanges.map((t) => `<tr><td class="o">${esc(t.origin || "—")}</td><td class="t">${esc(t.target || "—")}</td></tr>`).join("")}</tbody></table></div>` : ""}</div>`;
}
function judgeBlock(j) {
  if (!j) return "";
  return `<div class="d-sec"><h4>Judge</h4><div class="judge${j.accepted === "overturned" ? " over" : ""}"><b>${esc(j.accepted === "overturned" ? "Overturned" : j.accepted === "pass" ? "Holds" : j.accepted === "fail" ? "Upheld as a failure" : "Can't tell")}</b><p>${esc(j.note)}</p>${j.citations.map((x) => `<div class="cite"><span class="${x.verified ? "ok" : "no"}">${x.verified ? "✓ quote found" : "✗ quote not found"}</span> · ${esc(x.source)}: “${esc(x.quote)}”</div>`).join("")}${j.rejectedOverturn ? `<p><b>Overturn rejected:</b> ${esc(j.rejectedOverturn)}</p>` : ""}${j.suggested_claim ? `<p><b>Suggested claim:</b> ${esc(j.suggested_claim)}</p>` : ""}</div></div>`;
}
function testBlock(c) {
  if (!c.source) return "";
  const lines = c.source.snippet.split("\n").map((l, i) => `<span${/assert|expect|statusCode|body\(|then\(|toHave|toContain/.test(l) ? ' class="hl"' : ""}>${String(c.source.line + i).padStart(4)}  ${esc(l)}</span>`).join("\n");
  return `<div class="d-sec"><h4>Test · <span class="mono">${esc(c.source.file)}</span></h4>${c.head?.message ? `<div class="reasons"><pre style="white-space:pre-wrap;margin:0;font:12px var(--mono)">${esc(c.head.message.split("\n").slice(0, 10).join("\n"))}</pre></div><br>` : ""}<pre class="src">${lines}</pre></div>`;
}
function claimDrawer(c) {
  const side = c.parity && B.originSide === "origin" ? "origin" : "base";
  const o = exFor(c.testId, side), h = exFor(c.testId, "head");
  const sc = (B.screens || []).filter((s) => s.test === c.testId);
  return `<div class="d-kicker">${esc(c.id)} · ${esc(c.feature)} · ${esc((c.file || "").split("/").pop())}${c.line ? ":" + c.line : ""}${c.testId ? ` · proof <span class="mono">${esc(c.testId)}</span>` : ""}</div>
    <div class="d-title">${esc(c.text)}</div><span class="pill p-${c.status}">${SWORD[c.status]}</span> <span class="badges" style="display:inline-flex">${badges(c)}</span>
    ${c.reasons.length ? `<div class="d-sec"><div class="reasons">${c.reasons.map((r) => `<p>${esc(r)}</p>`).join("")}</div></div>` : ""}
    ${c.parity && c.parity.diffs.length ? `<div class="d-sec"><h4>Differences from ${esc(ORIGIN())}</h4>${diffTable(c.parity)}</div>` : ""}
    ${judgeBlock(c.judge)}
    ${sc.length ? `<div class="d-sec"><h4>Screens</h4>${sc.map(compareHtml).join("")}</div>` : ""}
    ${h.length || o.length ? `<div class="d-sec"><h4>Requests</h4><div class="cols"><div><div class="col-h">${esc(side === "origin" ? "legacy app" : BASE())}${c.base ? ` · test ${esc(c.base.status)}` : ""}</div>${o.length ? exList(o) : '<div class="empty">none</div>'}</div><div><div class="col-h">this change${c.head ? ` · test ${esc(c.head.status)}` : ""}</div>${h.length ? exList(h) : '<div class="empty">none</div>'}</div></div></div>` : ""}
    ${testBlock(c)}`;
}
function opDrawer(o) {
  const cs = B.claims.filter((c) => o.claims.some((x) => x.id === c.id));
  const ex = B.exchanges.filter((e) => e.side === "head" && e.run === "primary" && o.tests.includes(e.test) && e.method === o.method).slice(0, 6);
  return `<div class="d-kicker">${esc(o.feature)} · ${esc(OPWORD[o.state])}</div><div class="d-title"><span class="m">${o.method}</span> <span class="mono" style="font-size:16px">${esc(o.path)}</span></div><div class="t-why">${esc(o.summary)}</div>
    ${o.changed.length ? `<div class="d-sec"><h4>Why it counts as touched</h4><div class="reasons">${o.changed.map((x) => `<p>${esc(x)}</p>`).join("")}</div></div>` : ""}
    <div class="d-sec"><h4>Claims</h4>${cs.length ? cs.map((c) => claimRow(c, false)).join("") : `<div class="empty">No claim covers this endpoint.${o.calls ? " Existing tests call it." : " No test calls it."}</div>`}</div>
    <div class="d-sec"><h4>Tests that call it</h4>${o.tests.length ? o.tests.map((t) => `<div class="mono">${esc(t)}</div>`).join("") : '<div class="empty">none</div>'}</div>
    ${ex.length ? `<div class="d-sec"><h4>Requests on this change</h4>${ex.map(exHtml).join("")}</div>` : ""}`;
}
function screenDrawer(s) {
  const c = B.claims.find((x) => x.testId === s.test);
  return `<div class="d-kicker">${esc(s.test)}</div><div class="d-title">${esc(nice(s.name))}</div>${c ? claimRow(c, false) : ""}<div class="d-sec">${compareHtml(s)}</div>`;
}
let lastFocus = null;
function openDrawer(html) {
  if (!document.querySelector(".drawer")) lastFocus = document.activeElement;
  const root = document.getElementById("drawer-root");
  root.innerHTML = `<div class="scrim"></div><aside class="drawer" role="dialog" aria-modal="true"><button class="d-close">Close</button>${html}</aside>`;
  root.querySelector(".scrim").addEventListener("click", closeDrawer);
  root.querySelector(".d-close").addEventListener("click", closeDrawer);
  root.querySelectorAll("[data-claim]").forEach((b) => b.addEventListener("click", () => openDrawer(claimDrawer(B.claims.find((c) => c.id === b.dataset.claim)))));
  root.querySelector(".d-close").focus();
}
function closeDrawer() { document.getElementById("drawer-root").innerHTML = ""; lastFocus?.focus?.(); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

function render() {
  const v = document.getElementById("view");
  if (B.verdict === "mistrial") {
    v.innerHTML = `<div class="mistrial"><h2>Mistrial</h2><p>${esc(B.mistrial.message)}</p><p><b>Remedy:</b> ${esc(B.mistrial.remedy)}</p>${B.mistrial.logTail ? `<pre>${esc(B.mistrial.logTail)}</pre>` : ""}</div>`;
    return;
  }
  tabs();
  v.innerHTML = tab === "claims" ? claimsView() : tab === "screens" ? screensView() : tab === "run" ? runView() : overview();
  v.querySelectorAll("[data-f]").forEach((b) => b.addEventListener("click", () => { filter = b.dataset.f; render(); }));
  v.querySelectorAll("[data-op]").forEach((b) => b.addEventListener("click", () => openDrawer(opDrawer(ops().find((o) => o.key === b.dataset.op)))));
  v.querySelectorAll("[data-claim]").forEach((b) => b.addEventListener("click", () => openDrawer(claimDrawer(B.claims.find((c) => c.id === b.dataset.claim)))));
  v.querySelectorAll("[data-shot]").forEach((b) => b.addEventListener("click", () => openDrawer(screenDrawer(B.screens[+b.dataset.shot]))));
  v.querySelectorAll(".touched-item").forEach((b) => b.addEventListener("click", () => {
    if (b.dataset.kind === "op") openDrawer(opDrawer(ops().find((o) => o.key === b.dataset.key)));
    else if (b.dataset.kind === "claim") openDrawer(claimDrawer(B.claims.find((c) => c.id === b.dataset.key)));
    else { const [t, n] = b.dataset.key.split("|"); openDrawer(screenDrawer(B.screens.find((x) => x.test === t && x.name === n))); }
  }));
}
bar();
band();
render();
window.addEventListener("hashchange", () => { closeDrawer(); tab = (location.hash || "#overview").slice(1); render(); });
document.title = `${WORD[B.verdict]} · witness`;
</script>
</body>
</html>
