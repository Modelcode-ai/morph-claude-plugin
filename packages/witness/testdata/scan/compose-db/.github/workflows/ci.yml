name: ci
on: [push]
env:
  TEST_DIR: tests/e2e
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Migrate and test
        run: |
          # the e2e tests need the API up
          alembic upgrade head
          pytest ${{ env.TEST_DIR }}
