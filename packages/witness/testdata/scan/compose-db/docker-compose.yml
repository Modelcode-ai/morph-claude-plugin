services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app"]
  cache:
    image: redis:7-alpine
    ports:
      - "6380:6379"
  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
      - cache
