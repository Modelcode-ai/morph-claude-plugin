plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.12.2'
}

test {
    useJUnitPlatform()
    // per_test_timeout_arg = "-PkitTestTimeout={s}" in the kit's config: Gradle does not pass -D to the test JVM
    if (project.hasProperty('kitTestTimeout')) {
        systemProperty 'junit.jupiter.execution.timeout.default', "${project.property('kitTestTimeout')} s"
    }
}
